name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (macOS 15)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-v2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v2-

      - name: Clear stale module cache
        run: find .build -type d -name ModuleCache -exec rm -rf {} + 2>/dev/null || true

      - name: Checkout SharpAI/mlx-swift
        uses: actions/checkout@v4
        with:
          repository: SharpAI/mlx-swift
          path: mlx-swift

      - name: Redirect mlx-swift dependency to local checkout
        run: |
          sed -i '' -E 's|\.package\(path: "\.\./mlx-swift"\),|\.package(path: "./mlx-swift"),|' Package.swift

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (Release)
        run: swift build -c release -Xswiftc -enable-testing --build-tests

      - name: Install MLX Metal library
        run: |
          python3 -m venv /tmp/mlx_venv
          /tmp/mlx_venv/bin/pip install --quiet mlx
          MLX_LIB=$(find /tmp/mlx_venv -name "mlx.metallib" | head -n 1)
          # Copy to build root and release root
          cp $MLX_LIB .build/release/ 2>/dev/null || true
          cp $MLX_LIB ./ 2>/dev/null || true
          # Find the xctest bundle's MacOS directory and put it right next to the test runner binary
          find .build -type d -name "MacOS" -exec cp $MLX_LIB {}/ \; 2>/dev/null || true
          # Also put it in Resources just in case
          find .build -type d -name "Resources" -exec cp $MLX_LIB {}/ \; 2>/dev/null || true
          # Aggressive: put it next to any executable in the release dir
          find .build -type f -executable -exec cp $MLX_LIB $(dirname "{}")/ \; 2>/dev/null || true

      - name: Run Library Tests (Metal Accelerated)
        run: |
          # --no-parallel: GPU-heavy tests submit Metal command buffers that
          # aren't safe under concurrent access from multiple tests at once
          # (observed as a fatal `_status < MTLCommandBufferStatusCommitted`
          # assertion when two such tests overlapped on CI's runner).
          swift test -c release --skip-build --no-parallel

      - name: Speculative Decoding Protection Gate
        run: |
          # --no-parallel on every GPU gate, for the reason given above.
          # Ensure speculative decoding parity and cache integrity are never regressed
          swift test -c release --filter SpeculativeDecodingTests --skip-build --no-parallel

      - name: High-Rigor Architectural Parity (Gemma 4)
        run: |
          # Verify Gemma 4 Gated Residuals and PLE math integrity
          swift test -c release --filter Gemma4Tests --skip-build --no-parallel

      - name: Performance & Memory Ceiling Audit (8GB Target)
        run: |
          # Enforce 6GB RSS limit and throughput baselines
          swift test -c release --filter PerformanceRegressionTests --skip-build --no-parallel

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-test-results
          path: .build/artifacts/
          retention-days: 7

  xcodebuild-test:
    # Debug build: runs the DEBUG-only asserts that the Release job above
    # compiles out, with Metal shaders built from our mlx-swift source.
    name: xcodebuild test (Debug)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Checkout SharpAI/mlx-swift
        uses: actions/checkout@v4
        with:
          repository: SharpAI/mlx-swift
          path: mlx-swift

      - name: Redirect mlx-swift dependency to local checkout
        run: |
          sed -i '' -E 's|\.package\(path: "\.\./mlx-swift"\),|\.package(path: "./mlx-swift"),|' Package.swift

      - name: Test
        env:
          TEST_RUNNER_SWIFT_BACKTRACE: interactive=no,symbolicate=fast
        run: |
          xcodebuild test \
            -scheme mlx-swift-lm-Package \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-results
          path: TestResults.xcresult
          retention-days: 7

  integration-test:
    name: Build & Test SwiftLM Integration
    runs-on: macos-15
    steps:
      - name: Checkout mlx-swift-lm (this repository)
        uses: actions/checkout@v4
        with:
          path: mlx-swift-lm
          submodules: recursive

      - name: Checkout SwiftLM
        uses: actions/checkout@v4
        with:
          repository: SharpAI/SwiftLM
          # The newCache-throws fix (SwiftLM#167) has long been merged to main, so test
          # against main, as downstream_integration.yml does. The old temporary branch
          # is 167 commits behind main and cannot build against newer mlx-swift-lm.
          ref: main
          path: SwiftLM
          submodules: recursive

      - name: Select Xcode 26 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Redirect Dependencies to Local Form
        run: |
          cd SwiftLM
          
          # Replace the local submodule with the actively checked out code
          rm -rf mlx-swift-lm
          cp -r ../mlx-swift-lm .

      - name: Update mlx-swift submodule to latest main
        run: |
          cd SwiftLM/mlx-swift
          git fetch origin main
          git checkout origin/main
          
      - name: Build SwiftLM
        run: |
          cd SwiftLM
          swift build -c release

      - name: Install MLX Metal library
        run: |
          cd SwiftLM
          python3 -m venv /tmp/mlx_venv
          /tmp/mlx_venv/bin/pip install --quiet mlx
          MLX_LIB=$(find /tmp/mlx_venv -name "mlx.metallib" | head -n 1)
          cp $MLX_LIB .build/release/ 2>/dev/null || true

      - name: Run Speculative Decoding Tests
        run: |
          cd SwiftLM
          bash tests/test-speculative-eval.sh

  sealed-offline:
    # SL-28: build and run the offline conformance suites with the network DENIED (sandbox-exec), no weights. The
    # Metal toolchain and the MLX metallib are fetched BEFORE the seal (same as the main job). NOT a required check (branch protection is untouched). The dependency fetch happens before the seal;
    # scripts/conformance/offline-build/run-blocked.sh then self-tests the seal, resolves from the SwiftPM cache,
    # builds clean and runs the filters, failing on a vacuous (zero-test) filter.
    name: Sealed offline conformance (macOS 15)
    runs-on: macos-15
    # Observation phase: report the result without turning the workflow red (owner gate 2: observe once before merge).
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Checkout SharpAI/mlx-swift
        uses: actions/checkout@v4
        with:
          repository: SharpAI/mlx-swift
          path: mlx-swift

      # The fork's default branch is the dependency by design (Package.swift: "We MUST depend on the SharpAI fork"; a sync
      # bot advances it), same as the main job. Record exactly which revision this run used so a result can be reproduced.
      - name: Record the mlx-swift revision
        run: |
          rev=$(git -C mlx-swift rev-parse HEAD)
          echo "mlx-swift revision: $rev"
          echo "mlx-swift revision: \`$rev\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Redirect mlx-swift dependency to local checkout
        run: |
          sed -i '' -E 's|\.package\(path: "\.\./mlx-swift"\),|\.package(path: "./mlx-swift"),|' Package.swift

      - name: Install Metal Toolchain (network allowed, before the seal)
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Prefetch dependencies and the MLX Metal library (network allowed, before the seal)
        run: |
          swift package resolve
          # The metallib must come from the same MLX release as the C++ the Swift build compiles. That release is the
          # version in mlx-swift's bundled mlx/version.h, so pin the PyPI wheel to it (a missing wheel fails loudly here).
          MLX_VER=$(awk '/#define MLX_VERSION_(MAJOR|MINOR|PATCH) /{v[$2]=$3} END{printf "%s.%s.%s", v["MLX_VERSION_MAJOR"], v["MLX_VERSION_MINOR"], v["MLX_VERSION_PATCH"]}' mlx-swift/Source/Cmlx/mlx/mlx/version.h)
          echo "$MLX_VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::cannot read the MLX version from mlx-swift (got '$MLX_VER')"; exit 1; }
          echo "MLX version of the mlx-swift checkout: $MLX_VER"
          python3 -m venv /tmp/mlx_venv
          /tmp/mlx_venv/bin/pip install --quiet "mlx==$MLX_VER"
          find /tmp/mlx_venv -name "mlx.metallib" | head -n 1 > /tmp/mlx_metallib_path
          test -s /tmp/mlx_metallib_path

      - name: Build and test with network blocked
        env:
          FILTERS: "Conformance SharpAIOverlay"
          TEST_ARGS: "--no-parallel"
          POST_BUILD: |
            set -eu
            MLX_LIB=$(cat /tmp/mlx_metallib_path)
            test -f "$MLX_LIB" || { echo "::error::mlx.metallib not found at $MLX_LIB"; exit 1; }
            n=0
            while IFS= read -r d; do
              cp "$MLX_LIB" "$d/"
              n=$((n + 1))
            done < <({ find "$SCRATCH" -type d \( -name MacOS -o -name Resources \); find "$SCRATCH" -maxdepth 3 -type d -name debug; })
            echo "post-build: copied mlx.metallib into $n directories"
            test "$n" -gt 0 || { echo "::error::metallib not installed: no MacOS/Resources/debug directory under $SCRATCH"; exit 1; }
        run: bash scripts/conformance/offline-build/run-blocked.sh

      # continue-on-error keeps the workflow green, so say the verdict explicitly where a reviewer looks.
      - name: Sealed offline verdict
        if: always()
        run: |
          case "${{ job.status }}" in
            success) verdict=PASS ;;
            cancelled) verdict=CANCELLED ;;
            *) verdict=FAIL ;;
          esac
          echo "SEALED-OFFLINE: $verdict"
          { echo "### SEALED-OFFLINE: $verdict"; echo "Observation phase: this job is continue-on-error, so a FAIL does not turn the workflow red."; } >> "$GITHUB_STEP_SUMMARY"
