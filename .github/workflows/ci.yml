name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Two lanes, two runners, in parallel. The hosted macOS runners are over-subscribed and a job that is not given a runner within
# 15 minutes is cancelled with no steps run; the old four jobs had four chances to be starved. Two lanes have two, and a lane
# that starves can be rerun alone (`gh run rerun --failed`). The lanes share nothing within a run; they carry work over from
# PREVIOUS runs through actions/cache, keyed so that the expensive part survives: the Cmlx C/C++ (about 16 minutes in Release,
# compiled from mlx-swift sources that rarely change) is keyed on the mlx-swift commit and the Xcode version.
#   lib      Release build, full library tests, the three named gates (this also runs the explicit tests that replace the
#            library's assert()s, which Release compiles out)
#   swiftlm  SwiftLM main built against a clean copy of this checkout, all Release: speculative script + swift test; then the
#            sealed offline phase (network denied, no weights, Release; observation only: it cannot turn the job red; it always
#            builds clean by design, so it never uses a cache)
# We ship Release, so nothing is built in Debug. The former `xcodebuild test (Debug)` job is gone: it rebuilt the whole package
# in Debug for the sake of 14 assert()/assertionFailure() calls, which Release compiles out. Those invariants are now checked
# by explicit tests (KVCacheStorageInvariantTests, KVCacheMetaStateRestoreTests, OpenELMConfigurationTests and the tests added
# to KVCacheRoundTests, MTPSpeculativeTokenIteratorTests, ChatSessionTests, TextToolCallRecoveryTests). Two asserts have no
# test (Gemma3nText vocabSize > 0, Bitnet input dtype): no input can break them.
# Every step after the setup uses `!cancelled()`, so a failure in one phase does not hide the others. .build is kept between
# phases (and saved by the cache at the end) unless free disk drops under 20 GiB.
jobs:
  lib:
    name: CI lib (Release build, tests, gates)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      # ---- setup ----
      # ---- setup, once ----
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Checkout SharpAI/mlx-swift
        uses: actions/checkout@v4
        with:
          repository: SharpAI/mlx-swift
          path: mlx-swift

      - name: Redirect mlx-swift dependency to local checkout
        run: |
          sed -i '' -E 's|\.package\(path: "\.\./mlx-swift"\),|\.package(path: "./mlx-swift"),|' Package.swift

      - name: Record the mlx-swift revision
        run: echo "MLX_SWIFT_SHA=$(git -C mlx-swift rev-parse HEAD)" >> "$GITHUB_ENV"

      # Package.resolved is gitignored, so it cannot key the cache. Key on the mlx-swift commit (what the Cmlx objects depend
      # on), the Xcode version and the manifest, plus the commit so every green run saves; restore the closest earlier one.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-lib-spm-v4-xc263-${{ env.MLX_SWIFT_SHA }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lib-spm-v4-xc263-${{ env.MLX_SWIFT_SHA }}-${{ hashFiles('Package.swift') }}-
            ${{ runner.os }}-lib-spm-v4-xc263-${{ env.MLX_SWIFT_SHA }}-
            ${{ runner.os }}-lib-spm-v4-xc263-

      - name: Clear stale module cache
        run: find .build -type d -name ModuleCache -exec rm -rf {} + 2>/dev/null || true

      - name: Resolve dependencies
        run: swift package resolve

      # ---- Build and Test (macOS 15) ----
      - name: "[lib] Build (Release)"
        if: ${{ !cancelled() }}
        run: swift build -c release -Xswiftc -enable-testing --build-tests

      - name: "[lib] Install MLX Metal library"
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv /tmp/mlx_venv
          /tmp/mlx_venv/bin/pip install --quiet mlx
          MLX_LIB=$(find /tmp/mlx_venv -name "mlx.metallib" | head -n 1)
          # Copy to build root and release root
          cp $MLX_LIB .build/release/ 2>/dev/null || true
          cp $MLX_LIB ./ 2>/dev/null || true
          # Find the xctest bundle's MacOS directory and put it right next to the test runner binary
          find .build -type d -name "MacOS" -exec cp $MLX_LIB {}/ \; 2>/dev/null || true
          # Also put it in Resources just in case
          find .build -type d -name "Resources" -exec cp $MLX_LIB {}/ \; 2>/dev/null || true
          # Aggressive: put it next to any executable in the release dir
          find .build -type f -executable -exec cp $MLX_LIB $(dirname "{}")/ \; 2>/dev/null || true

      - name: "[lib] Run Library Tests (Metal Accelerated)"
        if: ${{ !cancelled() }}
        run: |
          # --no-parallel: GPU-heavy tests submit Metal command buffers that
          # aren't safe under concurrent access from multiple tests at once
          # (observed as a fatal `_status < MTLCommandBufferStatusCommitted`
          # assertion when two such tests overlapped on CI's runner).
          swift test -c release --skip-build --no-parallel

      - name: "[lib] Speculative Decoding Protection Gate"
        if: ${{ !cancelled() }}
        run: |
          # --no-parallel on every GPU gate, for the reason given above.
          # Ensure speculative decoding parity and cache integrity are never regressed
          swift test -c release --filter SpeculativeDecodingTests --skip-build --no-parallel

      - name: "[lib] High-Rigor Architectural Parity (Gemma 4)"
        if: ${{ !cancelled() }}
        run: |
          # Verify Gemma 4 Gated Residuals and PLE math integrity
          swift test -c release --filter Gemma4Tests --skip-build --no-parallel

      - name: "[lib] Performance & Memory Ceiling Audit (8GB Target)"
        if: ${{ !cancelled() }}
        run: |
          # Enforce 6GB RSS limit and throughput baselines
          swift test -c release --filter PerformanceRegressionTests --skip-build --no-parallel

      - name: "[lib] Upload test results on failure"
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: library-test-results
          path: .build/artifacts/
          retention-days: 7

      # Keep .build: the job-end cache save stores it, so the next run builds incrementally. Delete it only when space is short.
      - name: "[lib] Free disk (only if short)"
        if: ${{ !cancelled() }}
        run: |
          df -h / | tail -1
          avail=$(df -g / | awk 'NR==2{print $4}')
          if [ "$avail" -lt 20 ]; then echo "only ${avail} GiB free, removing .build"; rm -rf .build; df -h / | tail -1; fi

  swiftlm:
    name: CI SwiftLM (integration, sealed offline)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      # ---- setup ----
      # ---- setup, once ----
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Checkout SharpAI/mlx-swift
        uses: actions/checkout@v4
        with:
          repository: SharpAI/mlx-swift
          path: mlx-swift

      - name: Redirect mlx-swift dependency to local checkout
        run: |
          sed -i '' -E 's|\.package\(path: "\.\./mlx-swift"\),|\.package(path: "./mlx-swift"),|' Package.swift

      # The working tree (with ./mlx-swift and the redirected Package.swift) is what the sealed phase builds; SwiftLM itself is
      # built against the CLEAN copy below.

      # ---- Build & Test SwiftLM Integration (Release) ----
      # SwiftLM main is built against a CLEAN copy of this repository (the working tree above had Package.swift redirected).
      # The newCache-throws fix (SwiftLM#167) has long been merged to main, so test against main. The old temporary branch is
      # 167 commits behind main and cannot build against newer mlx-swift-lm.
      - name: "[swiftlm] Checkout a clean copy of this repository"
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          path: mlx-swift-lm-clean
          submodules: recursive

      - name: "[swiftlm] Checkout SwiftLM"
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          repository: SharpAI/SwiftLM
          ref: main
          path: SwiftLM
          submodules: recursive

      - name: "[swiftlm] Redirect SwiftLM to this checkout"
        if: ${{ !cancelled() }}
        run: |
          cd SwiftLM
          # Replace the local submodule with the actively checked out code
          rm -rf mlx-swift-lm
          cp -r ../mlx-swift-lm-clean mlx-swift-lm

      - name: "[swiftlm] Update mlx-swift submodule to latest main"
        if: ${{ !cancelled() }}
        run: |
          cd SwiftLM/mlx-swift
          git fetch origin main
          git checkout origin/main
          echo "SWIFTLM_MLX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: "[swiftlm] Cache SwiftLM Swift packages"
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: SwiftLM/.build
          key: ${{ runner.os }}-swiftlm-spm-v3-xc263-${{ env.SWIFTLM_MLX_SHA }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-swiftlm-spm-v3-xc263-${{ env.SWIFTLM_MLX_SHA }}-
            ${{ runner.os }}-swiftlm-spm-v3-xc263-

      - name: "[swiftlm] Build SwiftLM (Release, with its tests)"
        if: ${{ !cancelled() }}
        run: |
          cd SwiftLM
          swift build -c release -Xswiftc -enable-testing --build-tests

      - name: "[swiftlm] Install MLX Metal library"
        if: ${{ !cancelled() }}
        run: |
          cd SwiftLM
          python3 -m venv /tmp/mlx_venv
          /tmp/mlx_venv/bin/pip install --quiet mlx
          MLX_LIB=$(find /tmp/mlx_venv -name "mlx.metallib" | head -n 1)
          cp $MLX_LIB .build/release/ 2>/dev/null || true
          echo "MLX_METAL_LIB=$MLX_LIB" >> "$GITHUB_ENV"

      - name: "[swiftlm] Run Speculative Decoding Tests"
        if: ${{ !cancelled() }}
        run: |
          cd SwiftLM
          bash tests/test-speculative-eval.sh

      - name: "[swiftlm] Copy Metal library to the build outputs"
        if: ${{ !cancelled() }}
        run: |
          test -f "$MLX_METAL_LIB" || { echo "::error::mlx.metallib not found at $MLX_METAL_LIB"; exit 1; }
          sudo cp "$MLX_METAL_LIB" /usr/local/lib/mlx.metallib || true
          # Copy to all locations the test runner and linked bundles may search
          find SwiftLM/.build -type d \( -name "debug" -o -name "release" \) -exec cp "$MLX_METAL_LIB" {}/ \; 2>/dev/null || true
          find SwiftLM/.build -name "*.xctest" -exec cp "$MLX_METAL_LIB" {}/Contents/MacOS/ \; 2>/dev/null || true
          find SwiftLM/.build -name "*Tests" -type f -exec sh -c 'cp "'"$MLX_METAL_LIB"'" "$(dirname ${1})/"' _ {} \; 2>/dev/null || true

      - name: "[swiftlm] Run SwiftLM Integration Tests"
        if: ${{ !cancelled() }}
        run: |
          cd SwiftLM
          swift test -c release --parallel --skip-build

      # SwiftLM/.build is cached at job end, so keep SwiftLM unless space is short; the clean copy is always removed.
      - name: "[swiftlm] Free disk (only if short)"
        if: ${{ !cancelled() }}
        run: |
          rm -rf mlx-swift-lm-clean
          df -h / | tail -1
          avail=$(df -g / | awk 'NR==2{print $4}')
          if [ "$avail" -lt 20 ]; then echo "only ${avail} GiB free, removing SwiftLM"; rm -rf SwiftLM; df -h / | tail -1; fi

      # ---- Sealed offline conformance (Release) ----
      # SL-28: build and run the offline conformance suites with the network DENIED (sandbox-exec), no weights. The Metal
      # toolchain (installed in the setup) and the MLX metallib are fetched BEFORE the seal. This phase is observation only: it
      # is continue-on-error and prints an explicit verdict, so it cannot turn the job red. The dependency fetch happens before
      # the seal; scripts/conformance/offline-build/run-blocked.sh then self-tests the seal, resolves from the SwiftPM cache,
      # builds clean and runs the filters, failing on a vacuous (zero-test) filter.
      - name: "[sealed] Record the mlx-swift revision"
        if: ${{ !cancelled() }}
        run: |
          rev=$(git -C mlx-swift rev-parse HEAD)
          echo "mlx-swift revision: $rev"
          echo "mlx-swift revision: \`$rev\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "[sealed] Prefetch dependencies and the MLX Metal library (network allowed, before the seal)"
        if: ${{ !cancelled() }}
        run: |
          swift package resolve
          # The metallib must come from the same MLX release as the C++ the Swift build compiles. That release is the
          # version in mlx-swift's bundled mlx/version.h, so pin the PyPI wheel to it (a missing wheel fails loudly here).
          MLX_VER=$(awk '/#define MLX_VERSION_(MAJOR|MINOR|PATCH) /{v[$2]=$3} END{printf "%s.%s.%s", v["MLX_VERSION_MAJOR"], v["MLX_VERSION_MINOR"], v["MLX_VERSION_PATCH"]}' mlx-swift/Source/Cmlx/mlx/mlx/version.h)
          echo "$MLX_VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::cannot read the MLX version from mlx-swift (got '$MLX_VER')"; exit 1; }
          echo "MLX version of the mlx-swift checkout: $MLX_VER"
          rm -rf /tmp/mlx_venv_sealed
          python3 -m venv /tmp/mlx_venv_sealed
          /tmp/mlx_venv_sealed/bin/pip install --quiet "mlx==$MLX_VER"
          find /tmp/mlx_venv_sealed -name "mlx.metallib" | head -n 1 > /tmp/mlx_metallib_path
          test -s /tmp/mlx_metallib_path

      - name: "[sealed] Build and test with network blocked"
        id: sealed
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FILTERS: "Conformance SharpAIOverlay"
          BUILD_ARGS: "-c release -Xswiftc -enable-testing"
          TEST_ARGS: "-c release --no-parallel"
          POST_BUILD: |
            set -eu
            MLX_LIB=$(cat /tmp/mlx_metallib_path)
            test -f "$MLX_LIB" || { echo "::error::mlx.metallib not found at $MLX_LIB"; exit 1; }
            n=0
            while IFS= read -r d; do
              cp "$MLX_LIB" "$d/"
              n=$((n + 1))
            done < <({ find "$SCRATCH" -type d \( -name MacOS -o -name Resources \); find "$SCRATCH" -maxdepth 3 -type d \( -name debug -o -name release \); })
            echo "post-build: copied mlx.metallib into $n directories"
            test "$n" -gt 0 || { echo "::error::metallib not installed: no MacOS/Resources/debug directory under $SCRATCH"; exit 1; }
        run: bash scripts/conformance/offline-build/run-blocked.sh

      # continue-on-error keeps the job green, so say the verdict explicitly where a reviewer looks.
      - name: "[sealed] Sealed offline verdict"
        if: ${{ always() }}
        run: |
          case "${{ steps.sealed.outcome }}" in
            success) verdict=PASS ;;
            cancelled) verdict=CANCELLED ;;
            skipped) verdict=SKIPPED ;;
            *) verdict=FAIL ;;
          esac
          echo "SEALED-OFFLINE: $verdict"
          { echo "### SEALED-OFFLINE: $verdict"; echo "Observation phase: this phase is continue-on-error, so a FAIL does not turn the job red."; } >> "$GITHUB_STEP_SUMMARY"
