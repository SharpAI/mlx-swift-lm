name: 🔄 Auto-Sync Upstream

# Merges ml-explore/mlx-swift-lm main into this fork as a real merge commit, pushes it to
# a NEW branch (bot/upstream-<up>-<base>) and opens a PR. THE BOT NEVER APPROVES,
# REVIEWS OR MERGES: the only PR call is `gh pr create`, and it never
# force-pushes. A person reviews and merges the PR. Logic lives in
# .github/scripts/upstream-sync.sh (runnable locally; a dry run outside GitHub
# Actions). Conflicts are never resolved or pushed. A red run means a person has
# to act; see the script header.

on:
  schedule:
    - cron: '30 4 * * *' # Every day at 4:30 AM UTC
  workflow_dispatch: # Enable manual triggers
    inputs:
      dry_run:
        description: 'Dry run: merge and report, but push nothing and open no PR'
        type: boolean
        default: false

permissions:
  contents: write        # push the new bot/upstream-* branch (never an existing one)
  pull-requests: write   # `gh pr create` (+ list PRs); nothing here approves or merges

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tried first for `gh pr create`: a PR opened with a personal token
          # starts CI normally, one opened with GITHUB_TOKEN does not (close and
          # reopen it once). Needs "Pull requests: write". Optional.
          PR_TOKEN: ${{ secrets.SWIFTLM_PR_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          UPSTREAM_REPO: ml-explore/mlx-swift-lm
          # A merge that touches these is listed in the PR body for a human look.
          # Package.swift: the fork depends on ../mlx-swift (path), upstream on a tagged release.
          WATCH_PATHS: Package.swift
          # Fork-only lines a merge must not lose (path::fixed string, one per line).
          KEEP_LINES: |
            Package.swift::.package(path: "../mlx-swift")
          CONFLICT_HINTS: |
            - `Package.swift`: keep the local `../mlx-swift` path dependency; do not take upstream's mlx-swift requirement.
            - `UserInput*.swift`, `MediaProcessing`: keep the fork-only `.data(Data, format:)` audio source (SwiftLM's Server.swift builds audio from base64 data).
            - `Qwen2VL` / `Gemma4` message generators: keep the fork-only audio placeholders; Qwen3.5 VLM `sanitize`: keep the `MTPConfig.retainMTPWeights` guard.
            - `TurboQuantKernels.swift`, `ContinuationAssertions`, `KVCacheTests`: the fork carries TurboQuant and measured test tolerances.
            - Worked example of a full resolution: SharpAI/mlx-swift-lm#74.
        run: bash .github/scripts/upstream-sync.sh
